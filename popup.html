<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Magic Wand</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img class="logo" src="icons/icon48.png" alt="Magic Wand logo" />
      <div>
        <h1 class="title">Magic Wand</h1>
        <p class="subtitle">YouTube fixes &amp; tweaks</p>
      </div>
    </header>

    <ul class="settings">
      <li class="setting">
        <div class="setting-text">
          <span class="setting-name">Refresh on play</span>
          <span class="setting-desc">Reload the page once when a video starts, to fix playback.</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="playFix" />
          <span class="slider"></span>
        </label>
      </li>

      <li class="setting">
        <div class="setting-text">
          <span class="setting-name">Block Shorts</span>
          <span class="setting-desc">Hide all Shorts and open them as normal videos.</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="blockShorts" />
          <span class="slider"></span>
        </label>
      </li>
    </ul>

    <p class="footer">Changes apply instantly. Reload open YouTube tabs if needed.</p>

    <script src="popup.js"></script>
  </body>
</html>
